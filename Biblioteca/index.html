<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Gabriel Naranjo" />
    <title>Biblioteca Horizonte</title>
    <link rel="stylesheet" href="static/css/style.css" />
  </head>
  <body>
    <section class="Barra">
      <img src="static/images/Libro.png" alt="Logo" />
      <nav class="navbar bg-body-tertiary">
        <div class="container">
          <h1>
            Biblioteca <br>
            <span class="navbar-brand">Horizonte</span>
          </h1>
          <form class="d-flex" role="Email">
            <input
              class="form-control me-2"
              type="Email"
              placeholder="Email"
              aria-label="Email"
            />
            <button class="btn" type="submit">Ingresar</button>
            <div class="Seleccionado">
              <img src="static/images/libros.png" alt="Libros" />
              <span class="num">0</span>
            </div>
          </form>
        </div>
      </nav>
    </section>

    <section class="Cuadros">
      <div class="Libro">
        <img class="caja" src="static/images/Libro.png" alt="Novelas" />
        <p>Novelas</p>
      </div>

      <div class="Libro">
        <img class="caja" src="static/images/ciencia.png" alt="ciencia" />
        <p>Ciencia</p>
      </div>

      <div class="Libro">
        <img class="caja" src="static/images/Estatua.png" alt="Historia" />
        <p>Historia</p>
      </div>

      <div class="Libro">
        <img class="caja" src="static/images/PC.png" alt="tecnologia" />
        <p>tecnologia</p>
      </div>

      <div class="Libro">
        <img class="caja" src="static/images/Pintura.png" alt="Arte" />
        <p>Arte</p>
      </div>

      <div class="Libro">
        <img class="caja" src="static/images/oso.png" alt="" />
        <p>Infantil</p>
      </div>
    </section>

    <main class="principal">
      <section class="izquierda">
        <div class="bloque-titulo">
          <h2>Descubre<br />Nuevas<br />Historias<br /></h2>
        </div>

<div class="contenido-izquierda" id="videoContainer">
  <video id="miVideo" autoplay muted loop playsinline class="principal-video">
    <source src="static/videos/videoplayback.mp4" type="video/mp4">
    Tu navegador no soporta videos HTML5.
  </video>

  <img id="miImagen" src="static/images/Prince.png" alt="Miniatura de la biblioteca" style="display: none; width: 100%; max-width: 600px;">
</div>
      </section>

      <section class="derecha">
        <h2>Libros Recomendados:</h2>

        <div class="contenedor">
          <img src="static/images/Garcia.png" alt="Cien años de soledad" />
          <div class="info-tarjeta">
            <div class="texto-tarjeta">
              <h3>Cien años de soledad</h3>
              <p>Gabriel García Márquez</p>
              <a
                href="https://web.seducoahuila.gob.mx/biblioweb/upload/Garc%C3%ADa%20M%C3%A1rquez%20Gabriel%20-%20Cien%20a%C3%B1os%20de%20soledad.pdf"
                >Ver más...</a
              >
            </div>
            <button class="btn-mas">+</button>
          </div>
        </div>

        <div class="contenedor">
          <img src="static/images/Yuval.png" alt="Sapiens" />
          <div class="info-tarjeta">
            <div class="texto-tarjeta">
              <h3>Sapiens</h3>
              <p>Yuval Noah Harari</p>
              <a
                href="https://www.files.ecyte.org/archivos/PDF/SAPIENS%20-%20DE%20ANIMALES%20A%20DIOSES%20-%20YUVAL%20NOAH%20HARARI.pdf"
                >Ver más...</a
              >
            </div>
            <button class="btn-mas">+</button>
          </div>
        </div>

        <div class="contenedor">
          <img src="static/images/El principito.png" alt="El principito" />
          <div class="info-tarjeta">
            <div class="texto-tarjeta">
              <h3>El principito</h3>
              <p>Antoine de Saint-Exupéry</p>
              <a
                href="https://web.seducoahuila.gob.mx/biblioweb/upload/el%20principito.pdf"
                >Ver más...</a
              >
            </div>
            <button class="btn-mas">+</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
