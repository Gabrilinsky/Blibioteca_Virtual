<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Gabriel Naranjo" />
  <title>Tacos Palace</title>
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>

  <section class="Barra">
    <img src="static/images/logo.png" alt="Logo" />
    <nav class="navbar bg-body-tertiary">
      <div class="container">
        <h1>Tacos</h1>
        <h1 class="navbar-brand">Palace</h1>
        <form class="d-flex" role="Email">
          <input class="form-control me-2" type="Email" placeholder="Email" aria-label="Email" />
          <button class="btn" type="submit">Login</button>
          <div class="carrito">
          <img src="static/images/carrito.png" alt="Carrito" />
          <span class="num">0</span>
          </div>
        </form>
      </div>
    </nav>
  </section>

<section class="Cuadros">
  <div class="comida">
    <img class="caja" src="static/images/enchiladas.jpg" alt="Enchiladas" />
    <p>Novelas</p>
  </div>

  <div class="comida">
    <img class="caja" src="static/images/tacos.jpg" alt="Tacos" />
    <p>Ciencia</p>
  </div>

  <div class="comida">
    <img class="caja" src="static/images/flautas.jpg" alt="Flautas" />
    <p>Historia</p>
  </div>

  <div class="comida">
    <img class="caja" src="static/images/gorditas.jpg" alt="Gorditas" />
    <p>tecnologia</p>
  </div>

  <div class="comida">
    <img class="caja" src="static/images/tostadas.jpg" alt="Tostadas" />
    <p>Arte</p>
  </div>

  <div class="comida">
    <img class="caja" src="static/images/enfrijoladas.jpg" alt="Enfrijoladas" />
    <p>Infantil</p>
  </div>
</section>

 <main class="principal">
  <section class="izquierda">
    <div class="bloque-titulo">
      <h2>La mejor<br />variedad<br />en<br />platillos<br />de<br />comida<br /><span class="negrita">mexicana</span></h2>
    </div>

    <div class="contenido-izquierda">
      <p class="texto-domicilio">
        Contamos<br />con<br />
        <span class="subrayado">servicio</span> a<br />
        <span class="naranja">domicilio</span>
      </p>
      <!-- Asegúrate de poner el nombre y extensión exacta de tu imagen -->
      <img id="Pintura" class="caja-imagen" src="static/images/comida-mexicana.jpg" alt="Comida Mexicana" />
    </div>
  </section>

  <section class="derecha">
    <h2>Recomendados:</h2>
    
    <div class="contenedor">
      <img src="static/images/tacos.jpg" alt="Orden de Tacos" class="img-recomendado" />
      <div class="info-tarjeta">
        <div class="texto-tarjeta">
          <h3>Orden de Tacos</h3>
          <a href="#">Ver más...</a>
        </div>
        <button class="btn-mas">+</button>
      </div>
    </div>

    <div class="contenedor">
      <img src="static/images/flautas.jpg" alt="Orden de Flautas" class="img-recomendado" />
      <div class="info-tarjeta">
        <div class="texto-tarjeta">
          <h3>Orden de Flautas</h3>
          <a href="#">Ver más...</a>
        </div>
        <button class="btn-mas">+</button>
      </div>
    </div>
  </section>
</main>
